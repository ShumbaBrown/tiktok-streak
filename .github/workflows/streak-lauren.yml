name: TikTok Streak (Lauren)

on:
  schedule:
    # Runs daily at 9:00 AM EST (14:00 UTC)
    - cron: '0 14 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  send-message:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Send TikTok message
        id: send
        env:
          TIKTOK_COOKIES_B64: ${{ secrets.LAUREN_TIKTOK_COOKIES }}
          TIKTOK_RECIPIENT: ${{ secrets.LAUREN_TIKTOK_RECIPIENT }}
          TIKTOK_MESSAGE: ${{ secrets.LAUREN_TIKTOK_MESSAGE }}
        run: python send_message.py

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots-lauren
          path: /tmp/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Notify via GitHub issue on failure or expiring session
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notify() {
            title="$1"; body="$2"
            existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number' || true)
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
          }
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "${{ steps.send.outcome }}" = "failure" ]; then
            REASON=$(cat /tmp/streak-failure-reason.txt 2>/dev/null || echo "Unknown — see run logs.")
            notify "${{ github.workflow }}: daily message FAILED" \
              "The streak message was **not sent** today.

          **Reason:** $REASON

          [Run logs]($RUN_URL) — debug screenshots are attached as artifacts on the run.

          If the session expired: re-run \`python login.py\` on the affected account, then update the cookies secret."
          elif [ -f /tmp/streak-cookie-warning.txt ]; then
            notify "${{ github.workflow }}: session expiring soon" \
              "$(cat /tmp/streak-cookie-warning.txt)

          Re-run \`python login.py\` on the affected account and update the cookies secret to avoid a broken streak.

          [Run logs]($RUN_URL)"
          fi
